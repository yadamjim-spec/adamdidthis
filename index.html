<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adam is doing this…</title>
<meta name="description" content="Yury Adam — art direction & CG. Lisbon. New site in progress.">
<meta name="theme-color" content="#0C0C0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0C0C0C;color:#F2F1EC}
  body{font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  a:hover{opacity:.6}
  .page{min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,3.4vw,48px)}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
  .muted{color:#8C8C8C}
  .top,.bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px}
  .logo{font-weight:900;font-size:17px;letter-spacing:-.02em}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3DDC84;margin-right:8px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
  h1{margin:0;font-weight:900;font-size:clamp(56px,12.8vw,200px);line-height:.84;letter-spacing:-.065em}
  .dots span{animation:blink 1.4s infinite both}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  .render{margin-top:clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:10px;max-width:560px}
  .bar{height:2px;background:#262626;position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;background:#F2F1EC;transition:width .4s linear}
  .row{display:flex;justify-content:space-between;gap:16px}
  .bottom{border-top:1px solid #262626;padding-top:18px}
  @keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.dots span,.dot{animation:none}}
</style>
</head>
<body>
<main class="page">
  <header class="top mono">
    <span class="logo" style="font-family:'Inter Tight',sans-serif;text-transform:none;font-size:17px;letter-spacing:-.02em">Adam did this</span>
    <span class="muted"><span class="dot" aria-hidden="true"></span>New site in progress</span>
  </header>

  <section>
    <h1>Adam is doing this<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
    <div class="render mono muted" aria-hidden="true">
      <div class="row"><span>Rendering adamdidthis.com</span><span id="frame">Frame 0001 / 2400</span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </section>

  <footer class="bottom mono">
    <span class="muted">Art direction &amp; CG —— Lisbon</span>
    <a href="mailto:hi@adamdidthis.com">hi@adamdidthis.com</a>
    <a href="https://instagram.com/adamjim" target="_blank" rel="noopener">Instagram ↗</a>
  </footer>
</main>
<script>
  (function () {
    var total = 2400, f = 1, frame = document.getElementById('frame'), bar = document.getElementById('bar');
    function tick() {
      // slows down near the end: the render is never quite finished
      var left = total - f;
      f += Math.max(1, Math.round(left * 0.012));
      if (f > total - 1) f = total - 1;
      frame.textContent = 'Frame ' + String(f).padStart(4, '0') + ' / ' + total;
      bar.style.width = (f / total * 100).toFixed(2) + '%';
      setTimeout(tick, 120 + Math.random() * 260);
    }
    tick();
  })();
</script>
</body>
</html>
